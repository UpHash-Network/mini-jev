name: Source and fixture tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  stdlib:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: API and native protocol fixtures
        run: python -m unittest service.test_service test_native_engine native.test_packaging -v
      - name: Browser demonstration bridge fixtures
        run: python -m unittest demo.test_demo -v
      - name: Evaluation runner fixtures
        run: python -m unittest discover -s acceptance-v2 -p test_runner.py -v
      - name: Publication tests
        run: python -m unittest discover -s tests -p test_public_release.py -v
      - name: Native service configuration fixtures
        run: python -m unittest discover -s tests -p test_native_service_validation.py -v
      - name: Score audit fixtures
        run: python validate_score_edges.py --self-test
      - name: Paper statistics and external sampling fixtures
        run: |
          python -m unittest discover -s paper/analysis -p test_analysis.py -v
          python -m unittest discover -s paper/external_pilot -p test_pilot.py -v
          python -m unittest discover -s paper/external_expanded -p test_prepare.py -v
          python -m unittest discover -s paper/matched_study -p 'test_*.py' -v
      - name: Public artifact checks
        run: python scripts/check_public_release.py
      - name: Tracked generated directories must be empty
        run: |
          python - <<'PY'
          import subprocess
          paths = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          forbidden = [p for p in paths if p.split('/')[0] in {'.build', '.runs', '.cache', '.venv', 'models'}]
          if forbidden:
              raise SystemExit('Generated local directories are tracked')
          PY

  training-fixtures:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
      - name: Install CPU training dependencies
        run: |
          python -m pip install torch==2.12.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Training validation and feature fixtures (no model downloads)
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: python -m unittest discover -s tests -p 'test_training*.py' -v
